version: "3.9"
services:
  haproxy:
    image: haproxy:2.4
    user: haproxy
    entrypoint: >
      sh -c "
        exec haproxy -f /usr/local/etc/haproxy/haproxy.cfg
      "
    depends_on:
      rabbit1:
        condition: service_healthy
      rabbit2:
        condition: service_healthy
      rabbit3:
        condition: service_healthy
    tmpfs:
      - /tmp/haproxy:mode=1777,size=16m   # ← 핵심
    volumes:
      # (★) 호스트의 cfg → 컨테이너 cfg
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5672:5672"
      - "${EXTERNAL_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      elk-net:
        aliases:
          - haproxy

  # ─ RabbitMQ 3-node Quorum cluster ──────────────────────────
  rabbit1:
    build:
      context: ./rabbitmq-cluster
      dockerfile: Dockerfile
    hostname: rabbit1
    container_name: rabbit1
    environment:
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_NODENAME=${RABBITMQ_NODENAME_PREFIX}rabbit1
    volumes:
      - ./rabbitmq-cluster/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-cluster/data/rabbit1:/var/lib/rabbitmq/mnesia
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      elk-net:
        aliases:
          - rabbit1
  rabbit2:
    build:
      context: ./rabbitmq-cluster
      dockerfile: Dockerfile
    hostname: rabbit2
    container_name: rabbit2
    depends_on:
      rabbit1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_NODENAME=${RABBITMQ_NODENAME_PREFIX}rabbit2
    volumes:
      - ./rabbitmq-cluster/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-cluster/data/rabbit2:/var/lib/rabbitmq/mnesia
      
    entrypoint: >
      bash -c "
        rabbitmq-server -detached &&
        sleep 10 &&
        rabbitmqctl stop_app &&
        rabbitmqctl join_cluster ${RABBITMQ_NODENAME_PREFIX}rabbit1 &&
        rabbitmqctl start_app &&
        tail -f /dev/null
      "
    networks:
      elk-net:
        aliases:
          - rabbit2
          
  rabbit3:
    build:
      context: ./rabbitmq-cluster
      dockerfile: Dockerfile
    hostname: rabbit3
    container_name: rabbit3
    depends_on:
      rabbit1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_NODENAME=${RABBITMQ_NODENAME_PREFIX}rabbit3
    volumes:
      - ./rabbitmq-cluster/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-cluster/data/rabbit3:/var/lib/rabbitmq/mnesia
    entrypoint: >
      bash -c "
        rabbitmq-server -detached &&
        sleep 10 &&
        rabbitmqctl stop_app &&
        rabbitmqctl join_cluster ${RABBITMQ_NODENAME_PREFIX}rabbit1 &&
        rabbitmqctl start_app &&
        tail -f /dev/null
      "
    networks:
      elk-net:
        aliases:
          - rabbit3

  rabbit-final:
    image: curlimages/curl:7.85.0
    depends_on:
      rabbit1:
        condition: service_healthy
      rabbit2:
        condition: service_healthy
      rabbit3:
        condition: service_healthy
    volumes:
      - ./rabbitmq-cluster/definitions.json:/definitions.json:ro
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBIT_ADMIN_USER=${RABBIT_ADMIN_USER}
      - RABBIT_ADMIN_PASSWORD=${RABBIT_ADMIN_PASSWORD}
      - RABBIT_PRODUCER_USER=${RABBIT_PRODUCER_USER}
      - RABBIT_PRODUCER_PASSWORD=${RABBIT_PRODUCER_PASSWORD}
      - RABBIT_CONSUMER_USER=${RABBIT_CONSUMER_USER}
      - RABBIT_CONSUMER_PASSWORD=${RABBIT_CONSUMER_PASSWORD}
    entrypoint: >
      sh -c '
        set -euo pipefail

        # 0) 관리 API 인증(클러스터에 이미 있는 계정)
        AUTH_USER="$${RABBITMQ_DEFAULT_USER}"
        AUTH_PASS="$${RABBITMQ_DEFAULT_PASS}"
        HOST="rabbit1:15672"

        # 1) 치환 대상 경로/출력 경로
        DEF_IN="/definitions.json"
        DEF_OUT="/tmp/definitions.filled.json"

        # 2) .env에서 들어온 값(치환 대상)
        ADM_USER="$${RABBIT_ADMIN_USER}"
        ADM_PASS="$${RABBIT_ADMIN_PASSWORD}"
        PRD_USER="$${RABBIT_PRODUCER_USER}"
        PRD_PASS="$${RABBIT_PRODUCER_PASSWORD}"
        CNS_USER="$${RABBIT_CONSUMER_USER}"
        CNS_PASS="$${RABBIT_CONSUMER_PASSWORD}"

        [ -f "$$DEF_IN" ] || { echo "No $$DEF_IN"; exit 1; }

        # sed 안전 이스케이프
        esc() { printf "%s" "$1" | sed -e "s/[\\/&]/\\\\&/g" -e "s/\"/\\\\\"/g" -e "s/\\$/\\\\\\$/g" -e "s/{/\\\\{/g" -e "s/}/\\\\}/g"; }

        AUSER_ESC=$$(esc "$$ADM_USER")
        APASS_ESC=$$(esc "$$ADM_PASS")
        PUSER_ESC=$$(esc "$$PRD_USER")
        PPASS_ESC=$$(esc "$$PRD_PASS")
        CUSER_ESC=$$(esc "$$CNS_USER")
        CPASS_ESC=$$(esc "$$CNS_PASS")

        echo "$$(date) ⏳  waiting for rabbit1/2/3 to join…"
        while :; do
          json=$$(curl -s -u "$$AUTH_USER:$$AUTH_PASS" "http://$$HOST/api/nodes" || true)
          echo "$$json" | grep -q "\"name\":\"rabbit@rabbit1\"" || { sleep 5; continue; }
          echo "$$json" | grep -q "\"name\":\"rabbit@rabbit2\"" || { sleep 5; continue; }
          echo "$$json" | grep -q "\"name\":\"rabbit@rabbit3\"" || { sleep 5; continue; }
          break
        done

        echo "Waiting for 60 seconds…"; sleep 30

        echo "$$(date) 🧩  filling definitions variables…"
        sed -e "s|\$${RABBIT_ADMIN_USER}|$$AUSER_ESC|g" \
          -e "s|\$${RABBIT_ADMIN_PASSWORD}|$$APASS_ESC|g" \
          -e "s|\$${RABBIT_PRODUCER_USER}|$$PUSER_ESC|g" \
          -e "s|\$${RABBIT_PRODUCER_PASSWORD}|$$PPASS_ESC|g" \
          -e "s|\$${RABBIT_CONSUMER_USER}|$$CUSER_ESC|g" \
          -e "s|\$${RABBIT_CONSUMER_PASSWORD}|$$CPASS_ESC|g" \
          "$$DEF_IN" > "$$DEF_OUT"

        echo "$$(date) ✅  importing definitions…"
        curl -sS -u "$$AUTH_USER:$$AUTH_PASS" -H "Content-Type: application/json" \
          -X POST --data-binary @"$$DEF_OUT" \
          "http://$$HOST/api/definitions"

        curl -sS -u "$$AUTH_USER:$$AUTH_PASS" -X DELETE "http://$$HOST/api/permissions/%2F/guest" || true
        curl -sS -u "$$AUTH_USER:$$AUTH_PASS" -X DELETE "http://$$HOST/api/users/guest" || true
        echo "$$(date) 🎉  done."
      '
    networks:
      - elk-net

  # ─ Elasticsearch ───────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    mem_limit: "8g"
    container_name: log_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    healthcheck:
      disable: true
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - elk-net

  es-init:
    image: curlimages/curl:7.85.0
    container_name: es-init
    depends_on:
      - elasticsearch
    entrypoint: >
      sh -c '
        echo "Waiting for Elasticsearch HTTP port…";
        until curl -sf http://elasticsearch:9200; do
          sleep 5;
        done;

        echo "Waiting for built-in ecs@mappings component template…";
        # @는 %40으로 인코딩해야 정확히 감지됩니다
        until curl -sf http://elasticsearch:9200/_component_template/ecs%40mappings; do
          sleep 5;
        done;

        echo "All prerequisites met – loading logs-default index template…";

        if response=$$(curl --fail-with-body -sS -X PUT \
             "http://elasticsearch:9200/_index_template/logs-default" \
             -H "Content-Type: application/json" \
             --data "@/templates/logs-default.json"); then
          echo "✅ Index template loaded.";
        else
          echo "❌ Failed to load index template:" >&2;
          echo "$$response" >&2;
          exit 1;
        fi
      '
    volumes:
      - ./es/templates/logs-default.json:/templates/logs-default.json:ro
    networks:
      - elk-net

  # ─ Logstash 4 instances ────────────────────────────────────
  logstash1:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: logstash1
    depends_on:
      - rabbit1
      - rabbit2
      - rabbit3
      - es-init
    volumes:
      - ./logstash/pipeline1:/usr/share/logstash/pipeline
      - ./wait-for-it.sh:/usr/local/bin/wait-for-it.sh
    entrypoint: >
      bash -c "
        # 1) ES 준비 대기
        /usr/local/bin/wait-for-it.sh elasticsearch:9200 --strict --timeout=120 &&
        # 2) RabbitMQ 준비 대기
        /usr/local/bin/wait-for-it.sh haproxy:5672 --strict --timeout=60 &&
        # 3) 준비되면 Logstash 진짜 진입점 실행
        exec /usr/local/bin/docker-entrypoint
      "
    networks:
      - elk-net

  logstash2:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: logstash2
    depends_on:
      - rabbit1
      - rabbit2
      - rabbit3
      - es-init
    volumes:
      - ./logstash/pipeline2:/usr/share/logstash/pipeline
      - ./wait-for-it.sh:/usr/local/bin/wait-for-it.sh
    entrypoint: >
      bash -c "
        # 1) ES 준비 대기
        /usr/local/bin/wait-for-it.sh elasticsearch:9200 --strict --timeout=120 &&
        # 2) RabbitMQ 준비 대기
        /usr/local/bin/wait-for-it.sh haproxy:5672 --strict --timeout=60 &&
        # 3) 준비되면 Logstash 진짜 진입점 실행
        exec /usr/local/bin/docker-entrypoint
      "
    networks:
      - elk-net

  logstash3:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: logstash3
    depends_on:
      - rabbit1
      - rabbit2
      - rabbit3
      - es-init
    volumes:
      - ./logstash/pipeline3:/usr/share/logstash/pipeline
      - ./wait-for-it.sh:/usr/local/bin/wait-for-it.sh
    entrypoint: >
      bash -c "
        # 1) ES 준비 대기
        /usr/local/bin/wait-for-it.sh elasticsearch:9200 --strict --timeout=120 &&
        # 2) RabbitMQ 준비 대기
        /usr/local/bin/wait-for-it.sh haproxy:5672 --strict --timeout=60 &&
        # 3) 준비되면 Logstash 진짜 진입점 실행
        exec /usr/local/bin/docker-entrypoint
      "
    networks:
      - elk-net

  grafana:
    image: grafana/grafana-oss:latest
    depends_on:
      - elasticsearch
    ports:
      - "${EXTERNAL_GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP="false" # 일반 사용자 가입 금지
      - GF_AUTH_ANONYMOUS_ENABLED="true" # 익명 조회 허용

      # 익명 사용자 역할 추가
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # 임베딩 허용 설정 추가
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # X-Frame-Options 헤더 설정 제거
      - GF_SECURITY_X_FRAME_OPTIONS=

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    networks:
      - elk-net
    restart: unless-stopped
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    networks:
      - elk-net

networks:
  elk-net:
    driver: bridge

volumes:
  grafana-data:
  redis-data:
  es-data:
